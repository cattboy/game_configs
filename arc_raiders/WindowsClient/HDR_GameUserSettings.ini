[SystemSettings]

r.AllowHDR=1
r.HDR.EnableHDROutput=1
r.HDR.Display.OutputDevice=3
r.HDR.Display.ColorGamut=2
r.HDR.Display.MaxLuminance=1000
r.HDR.Display.MidLuminance=21.0
r.HDR.Display.MinLuminanceLog10=-8.0
r.HDR.UI.Luminance=300


//Towards the bottom of the file there is a line that says bUseHDRDisplayOutput=False.Add changes to bottom same secion

//Some of these value can be changed depending on the monitor/setup and/or personal preference. If you have dolby vision support, leave it at the settings I put in. If not, you can remove the color gamut line and change the outputdevice to 5. Then hit save on the file, and also set this to read only. Arc Raiders will now natively display HDR. Only issue I can find is that Frame Generation turns a red shade when using this but if FG is disabled it is perfect. More can be read about HDR and UE5 here:

